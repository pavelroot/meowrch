# Настройки курсора для Wayland
# Этот файл содержит настройки курсора для обеспечения единообразия

# Переменные окружения для курсора
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# Дополнительные переменные для лучшей совместимости с Wayland
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland

# Настройки для XWayland приложений
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24



